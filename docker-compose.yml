# =============================================================================
# Docker Compose — MyKanban Cluster
#
# Services:
#   potti   PostgreSQL 16 database (persistent volume-backed)
#   varam   Go REST API backend (depends-on potti)
#   laxmi   Next.js frontend (depends-on varam)
#
# Networks:
#   mycan_net — isolated bridge for inter-service communication
#
# Volumes:
#   potti_data      — survives `docker compose down` (no -v flag)
#   backend_storage — JSON flat-file persistence (survives down)
# =============================================================================

name: mycan

services:

  # -------------------------------------------------------------------------
  # potti — PostgreSQL 16 Database
  # -------------------------------------------------------------------------
  potti:
    image: postgres:16-alpine
    container_name: mycan-potti
    hostname: potti
    restart: unless-stopped
    networks:
      - mycan_net
    ports:
      # Exposed for external tooling (pgAdmin, DBeaver, etc.)
      # Comment out if you only want inter-container access.
      - "5432:5432"
    environment:
      POSTGRES_USER:       ${PG_USER:-mycan}
      POSTGRES_DB:         ${PG_DB:-mykanban}
      POSTGRES_PASSWORD:   ${PG_PASSWORD:?PG_PASSWORD is required — set it in .env or the shell}
    volumes:
      - potti_data:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${PG_USER:-mycan} -d ${PG_DB:-mykanban}"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 30s

  # -------------------------------------------------------------------------
  # varam — MyKanban Go Backend API
  # -------------------------------------------------------------------------
  varam:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mycan-varam
    hostname: varam
    restart: unless-stopped
    networks:
      - mycan_net
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH:              /etc/mycan/config.json
      PG_HOST:                  potti
      PG_PORT:                  5432
      PG_USER:                  ${PG_USER:-mycan}
      PG_PASSWORD:              ${PG_PASSWORD:?}
      PG_DB:                    ${PG_DB:-mykanban}
      ALLOWED_ORIGINS:          ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET:               ${JWT_SECRET:-change-me-to-a-strong-random-secret-in-production}
      GOOGLE_CLIENT_ID:         ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:     ${GOOGLE_CLIENT_SECRET:-}
      ROOT_EMAIL:               ${ROOT_EMAIL:-admin@mykanban.local}
      ROOT_PASSWORD_HASH:       ${ROOT_PASSWORD_HASH:-}
    volumes:
      # Bind-mount the JSON config so the container reads the host's real file
      - ./backend/config.json:/etc/mycan/config.json:ro
      # Persist flat-file storage data across restarts
      - backend_storage:/app/backend/storage
    depends_on:
      potti:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # laxmi — MyKanban Next.js Frontend
  # -------------------------------------------------------------------------
  laxmi:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mycan-laxmi
    hostname: laxmi
    restart: unless-stopped
    networks:
      - mycan_net
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:                 production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      varam:
        condition: service_started

# =============================================================================
# Volumes
# =============================================================================
volumes:
  potti_data:
    name: mycan_potti_data
    # Intentionally NOT external — Docker Compose manages lifecycle.
    # Use the 'delete' subcommand with care to preserve this volume.

  backend_storage:
    name: mycan_backend_storage

# =============================================================================
# Networks
# =============================================================================
networks:
  mycan_net:
    name: mycan_net
    driver: bridge
    # IPv4 only — no IPV6 complexity for local development.