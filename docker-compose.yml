version: '3.8'

services:
  chitta:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mycan-chitta:latest
    container_name: mycan-chitta
    ports:
      - "8080:8080"
    volumes:
      - chitta_data:/data/storage
      # Uncomment and map your config file if needed:
      # - ./backend-config.json:/etc/mycan/config.json
    environment:
      # Default environments, overridden if config.json is mounted
      - PORT=8080
      - STORAGE_DIR=/data/storage
    restart: unless-stopped

  maya:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mycan-maya:latest
    container_name: mycan-maya
    ports:
      - "3000:3000"
    environment:
      # The API URL accessed by the frontend inside the docker network
      # The service name 'chitta' is used for inter-container communication
      - NEXT_PUBLIC_API_URL=http://chitta:8080
    restart: unless-stopped
    depends_on:
      - chitta

volumes:
  chitta_data:
