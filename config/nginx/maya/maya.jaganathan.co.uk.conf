server {
    listen 80;
    server_name maya.jaganathan.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name maya.jaganathan.co.uk;

    # SSL configuration - replace with your actual certificate paths
    ssl_certificate /etc/letsencrypt/live/maya.jaganathan.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maya.jaganathan.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/maya.jaganathan.co.uk.access.log;
    error_log  /var/log/nginx/maya.jaganathan.co.uk.error.log;

    # Root directory for the Next.js static export
    root /apps/maya;

    index index.html;

    location / {
        # Try to serve static files directly, fallback to index.html for SPAs
        try_files $uri $uri/ /index.html;
    }
}
